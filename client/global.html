<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Negotiation Games — Table View</title>
<link rel="stylesheet" href="/client/chrome.css">
</head>
<body>
<div id="layout">
  <div id="stage">
    <div id="topband">
      <div id="wordmark">NEGO<span>TIATE</span></div>
      <div id="clock">MATCH 0</div>
      <div id="topright">
        <span id="statuschip">connecting…</span>
        <button id="feedtoggle">LOG »</button>
      </div>
    </div>
    <div id="scorebug"></div>
    <!-- negotiation-games additions to the inherited cogame-babel chrome -->
    <div id="gameblock">
      <div id="matchbar"></div>
      <div id="valuestrip"></div>
    </div>
    <!-- end negotiation-games additions -->
    <div id="board-wrap">
      <canvas id="table" width="960" height="640"></canvas>
      <div id="lightpool"></div>
      <div id="grain"></div>
      <div id="endscreen"></div>
    </div>
    </div>
  <div id="feed"></div>
</div>
<script src="/client/chrome_common.js"></script>
<script src="/client/renderer.js"></script>
<script>
  var canvas = document.getElementById("table");
  function fit() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    NegotiationRenderer.relayout();
  }
  window.addEventListener("resize", fit);
  window.addEventListener("load", fit);
  fit();
  NegotiationRenderer.bindFeedToggle(document.getElementById("feedtoggle"));
  NegotiationRenderer.attachLive({
    canvas: canvas,
    feed: document.getElementById("feed"),
    status: document.getElementById("statuschip"),
    clock: document.getElementById("clock"),
    scorebug: document.getElementById("scorebug"),
    endscreen: document.getElementById("endscreen"),
    assetBase: "/client/assets",
    wsPath: "/global"
  });
</script>
</body>
</html>
