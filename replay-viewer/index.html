<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Negotiation Games — Replay</title>
<link rel="stylesheet" href="./chrome.css">
</head>
<body>
<div id="layout">
  <div id="stage">
    <div id="topband">
      <div id="wordmark">NEGO<span>TIATE</span></div>
      <div id="clock">MATCH 0</div>
      <div id="topright">
        <span id="statuschip">replay</span>
        <button id="feedtoggle">LOG »</button>
      </div>
    </div>
    <div id="scorebug"></div>
    <!-- negotiation-games additions to the inherited cogame-babel chrome -->
    <div id="gameblock">
      <div id="matchbar"></div>
      <div id="valuestrip"></div>
    </div>
    <!-- end negotiation-games additions -->
    <div id="board-wrap">
      <canvas id="table" width="960" height="640"></canvas>
      <div id="lightpool"></div>
      <div id="grain"></div>
      <div id="endscreen"></div>
    </div>
    <div id="transport">
      <div class="scrub" id="scrub"></div>
      <div class="tbar">
        <button class="tbtn" id="play">❚❚</button>
        <span class="tpos" id="pos">0 / 0</span>
      </div>
    </div>
    </div>
  <div id="feed"></div>
</div>
<div id="loading">LOADING REPLAY…</div>
<script src="./chrome_common.js"></script>
<script src="./renderer.js"></script>
<script src="./negotiation_replay.js"></script>
<script src="./static_replay.js"></script>
<script>
  var canvas = document.getElementById("table");
  function fit() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    NegotiationRenderer.relayout();
  }
  window.addEventListener("resize", fit);
  window.addEventListener("load", fit);
  fit();
  NegotiationRenderer.bindFeedToggle(document.getElementById("feedtoggle"), true);
  // attach happens in static_replay.js once the wasm module loads
</script>
</body>
</html>
